      x-summary-source: derived
components:
  schemas:
    Tag:
      description: ''
      required:
      - id
      - name
      properties:
        id:
          type: integer
          isRequired: true
        name:
          type: string
          isRequired: true
      type: object
      additionalProperties: false
    Subscriber:
      description: ''
      required:
      - id
      - page_id
      - user_refs
      - first_name
      - last_name
      - name
      - gender
      - profile_pic
      - locale
      - language
      - timezone
      - live_chat_url
      - last_input_text
      - optin_phone
      - phone
      - optin_email
      - email
      - subscribed
      - last_interaction
      - last_seen
      - is_followup_enabled
      - ig_username
      - ig_id
      - whatsapp_phone
      - whatsapp_bsuid
      - whatsapp_username
      - optin_whatsapp
      - custom_fields
      - tags
      properties:
        id:
          type: string
          isRequired: true
        page_id:
          description: This is Facebook Page ID
          type: string
          isRequired: true
        user_refs:
          description: array with ref of subscriber; can be empty
          type: array
          items:
            $ref: '#/components/schemas/Subscriber_Ref_Field'
          example: '[{ ''user_ref'':''-1543835812530302162'', ''opted_in'':''2018-12-03T11:17:54+00:00'' }]'
          isRequired: true
        first_name:
          type: string
          isRequired: true
        last_name:
          type: string
          isRequired: true
        name:
          type: string
          isRequired: true
        gender:
          type: string
          isRequired: true
        profile_pic:
          type: string
          isRequired: true
        locale:
          type: string
          isRequired: true
        language:
          type: string
          isRequired: true
        timezone:
          type: string
          isRequired: true
        live_chat_url:
          type: string
          isRequired: true
        last_input_text:
          type: string
          isRequired: true
        optin_phone:
          type: boolean
          isRequired: true
        phone:
          type: string
          isRequired: true
        optin_email:
          type: boolean
          isRequired: true
        email:
          type: string
          isRequired: true
        subscribed:
          description: datetime in W3C format
          type: string
          example: '''2018-07-02T00:00:00+02:00'''
          isRequired: true
        last_interaction:
          description: datetime in W3C format
          type:
          - string
          - 'null'
          example: '''2018-07-02T00:00:00+02:00'''
          isRequired: true
        last_seen:
          description: datetime in W3C format
          type: string
          example: '''2018-07-02T00:00:00+03:00'''
          isRequired: true
        is_followup_enabled:
          type: boolean
          example: true
          isRequired: true
        ig_username:
          type: string
          example: user_name
          isRequired: true
        ig_id:
          type: integer
          example: 6384638
          isRequired: true
        whatsapp_phone:
          type: string
          isRequired: true
        whatsapp_bsuid:
          type:
          - string
          - 'null'
          example: US.8234928392384832
          isRequired: true
        whatsapp_username:
          type:
          - string
          - 'null'
          example: '@username'
          isRequired: true
        optin_whatsapp:
          type: boolean
          example: true
          isRequired: true
        custom_fields:
          type: array
          items:
            $ref: '#/components/schemas/Subscriber_Custom_Field'
          isRequired: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          isRequired: true
      type: object
      additionalProperties: false
    Response_Error_With_Code:
      description: ''
      required:
      - status
      - message
      - code
      properties:
        status:
          type: string
          example: error
          isRequired: true
        message:
          type: string
          isRequired: true
        code:
          type: integer
          isRequired: true
      type: object
      additionalProperties: false
    Response_Error:
      description: ''
      required:
      - status
      - message
      - details
      properties:
        status:
          type: string
          example: error
          isRequired: true
        message:
          type: string
          isRequired: true
        details:
          required:
          - messages
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/Response_Error_Message'
              isRequired: true
          type: object
          additionalProperties: false
          isRequired: true
      type: object
      additionalProperties: false
    Response_Success:
      description: ''
      required:
      - status
      properties:
        status:
          type: string
          example: success
          isRequired: true
      type: object
      additionalProperties: false
    Subscriber_Ref_Field:
      description: ''
      required:
      - user_ref
      - opted_in
      properties:
        user_ref:
          type: string
          example: '-1543835812530302162'
          isRequired: true
        opted_in:
          description: datetime in W3C format
          type: string
          example: '2018-12-03T11:17:54+00:00'
          isRequired: true
      type: object
      additionalProperties: false
    Subscriber_Custom_Field:
      description: ''
      required:
      - id
      - name
      - type
      - description
      - value
      properties:
        id:
          type: integer
          isRequired: true
        name:
          type: string
          isRequired: true
        type:
          type: string
          enum:
          - text
          - number
          - date
          - datetime
          - boolean
          isRequired: true
