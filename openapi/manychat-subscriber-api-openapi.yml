            application/json:
              schema:
                properties:
                  status:
                    type: string
                    example: success
                    isRequired: true
                  data:
                    $ref: '#/components/schemas/Subscriber'
                type: object
        '400':
          description: Possible error codes:<br>2011 - User_ref isn't registered<br>2012 - User_ref has not been linked with subscriber_id
          content:
