  /fb/subscriber/setCustomField:
    post:
      tags:
      - Subscriber
      summary: 81138a426b0903687848fdf8bdde6aa9
      description: '***Limit:*** 10 queries per second'
      operationId: 81138a426b0903687848fdf8bdde6aa9
      requestBody:
        description: 'Depending on the type of Custom User Field you will need to use one of the following type of data for "field_value".<br>

          ***For example:***<br>

          Text: "text" (string)<br>

          Number: 123 or 1.23 (integer or float)<br>

          Boolean: true or false (boolean)<br>

          Date: "2018-07-18" (string)<br>

          Date and time: "2018-07-02T00:00:00+00:00" (string)<br>

          <br>

          Data and time format for this API method is YYYY-MM-DDTHH:MM:SSP.  Where P is user’s timezone. For example May 1st 2018 06:30:24 UTC+3:00 should be formatted as 2018-05-01T06:30:24+03:00'
        required: true
        content:
          application/json:
            schema:
              required:
              - subscriber_id
              - field_id
              - field_value
              properties:
                subscriber_id:
                  type: integer
                  isRequired: true
                field_id:
                  type: integer
                  isRequired: true
                field_value:
                  description: string, integer or boolean (see method description)
                  example: '''string'', 123, true, ''2018-07-18'', ''2018-07-02T00:00:00+00:00'''
                  isRequired: true
              type: object
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Success'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Error'
      security:
      - Bearer: []
      x-summary-source: derived
  /fb/subscriber/setCustomFields:
    post:
      tags:
      - Subscriber
      summary: 4d01076149250e9e47f3b8aa7dc53baa
      description: '***Limit:*** 10 queries per second'
      operationId: 4d01076149250e9e47f3b8aa7dc53baa
      requestBody:
        description: 'Set multiple custom fields for a single subscriber.<br>

          The number of custom fields is limited to 20 for one request.<br>

          Use **field_id** OR **field_name** to specify the field.<br>

          ***For example:***<br>

          <br>

          ```"fields": [{"field_id": 77777777, "field_value": 555}, {"field_name": "count", "field_value": 12}]```'
        required: true
        content:
          application/json:
            schema:
              required:
              - subscriber_id
              - fields
              properties:
                subscriber_id:
                  type: integer
                  isRequired: true
                fields:
                  type: array
                  items:
                    required:
                    - field_id
                    - field_name
                    - field_value
                    properties:
                      field_id:
                        type: integer
                        isRequired: true
                      field_name:
                        type: string
                        isRequired: true
                      field_value:
                        description: string, integer or boolean (see method description)
                        example: '''string'', 123, true, ''2018-07-18'', ''2018-07-02T00:00:00+00:00'''
                        isRequired: true
                    type: object
                    additionalProperties: false
                  isRequired: true
              type: object
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Success'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Error'
      security:
      - Bearer: []
      x-summary-source: derived
  /fb/subscriber/setCustomFieldByName:
    post:
      tags:
      - Subscriber
      summary: Adc69e1e87197b5f31c80403a3913468
      description: '***Limit:*** 10 queries per second'
      operationId: adc69e1e87197b5f31c80403a3913468
      requestBody:
        description: 'Depending on the type of Custom User Field you will need to use one of the following type of data for "field_value".<br>

          ***For example:***<br>

          Text: "text" (string)<br>

          Number: 123 or 1.23 (integer or float)<br>

          Boolean: true or false (boolean)<br>

          Date: "2018-07-18" (string)<br>

          Date and time: "2018-07-02T00:00:00+00:00" (string)<br>

          <br>

          Data and time format for this API method is YYYY-MM-DDTHH:MM:SSP.  Where P is user’s timezone. For example May 1st 2018 06:30:24 UTC+3:00 should be formatted as 2018-05-01T06:30:24+03:00'
        required: true
        content:
          application/json:
            schema:
              required:
              - subscriber_id
              - field_name
              - field_value
              properties:
                subscriber_id:
                  type: integer
                  isRequired: true
                field_name:
                  description: not case sensitive
                  type: string
                  isRequired: true
                field_value:
                  description: string, integer or boolean (see method description)
                  example: '''string'', 123, true, ''2018-07-18'', ''2018-07-02T00:00:00+00:00'''
                  isRequired: true
              type: object
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Success'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Error'
      security:
      - Bearer: []
      x-summary-source: derived
  /fb/subscriber/verifyBySignedRequest:
    post:
      tags:
      - Subscriber
      summary: B14c21e0143af0449cfc94e58731c5a8
      description: '***Limit:*** 10 queries per second'
      operationId: b14c21e0143af0449cfc94e58731c5a8
      requestBody:
        description: <https://developers.facebook.com/docs/messenger-platform/webview/>
        required: true
        content:
          application/json:
            schema:
              required:
              - subscriber_id
              - signed_request
              properties:
                subscriber_id:
                  type: integer
                  isRequired: true
                signed_request:
                  type: string
                  example: _1SXnOuwXiUrcDRxI1D6Dvr55aiNusDNMxyHb8PQe7Y.eyJhbGdvcml0aG0iOiJIT2FDLVNIQTI1NiIsImNvbW11bml0eV9pZCI6bnVsbCwiaXNzdWVkX2F0IjoxNTU5MjE8NTQxLCJtZXRhZGF0YSI6bnVsbCwicGFnZV9pZCI6MjI4NjkwMDEyNDk2MTgxOSwicHNpZCI6IjIxNzI0OTkwNDI4Njc2MjIiLCJ0aHJlYWRfcGFydGljaXBhbnRfaWRzIjpudWxsLCJ0aHJlYWRfdHlwZSI6IlVTRVJfVE9fUEFHRSIsInRpZCI1IjIxNzI0OTkwNDI4Njc2MjIifQ
                  isRequired: true
              type: object
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  status:
                    type: string
                    example: success
                    isRequired: true
                type: object
      security:
      - Bearer: []
      x-summary-source: derived
  /fb/subscriber/createSubscriber:
    post:
      tags:
      - Subscriber
      summary: Create a Unified subscriber
      description: '***Limit:*** 10 queries per second'
      operationId: f42eb3580f33178fdf9d87f0c778f86e
      requestBody:
        description: ''
        required: true
        content:
          application/json:
            schema:
              properties:
                first_name:
                  description: First Name
                  type: string
                  isRequired: true
                last_name:
                  description: Last Name
                  type: string
                  isRequired: true
                phone:
                  description: Phone Number is required if Email and Whatsapp Phone properties are empty
                  type: string
                  isRequired: true
                whatsapp_phone:
                  description: Whatsapp Phone Number is required if Email and Phone Number properties are empty
                  type: string
                  isRequired: true
                email:
                  description: Email is required if Phone Number and Whatsapp Phone properties are empty
                  type: string
                  isRequired: true
                gender:
                  description: Gender
                  type: string
                  isRequired: true
                has_opt_in_sms:
                  description: Has opt-in SMS is required if property Phone Number is not empty
                  type: boolean
                  isRequired: true
                has_opt_in_email:
                  description: Has opt-in Email is required if property Email is not empty
                  type: boolean
                  isRequired: true
                consent_phrase:
                  description: Consent phrase is required if property `has_opt_in_sms` equal true
                  type: string
                  isRequired: true
              type: object
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  status:
                    type: string
                    example: success
                    isRequired: true
                  data:
                    $ref: '#/components/schemas/Subscriber'
                type: object
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Error'
      security:
      - Bearer: []
  /fb/subscriber/updateSubscriber:
    post:
      tags:
      - Subscriber
      summary: 3ab84a004f4a5942e7a5368c2b807d19
      description: '***Limit:*** 10 queries per second'
      operationId: 3ab84a004f4a5942e7a5368c2b807d19
      requestBody:
        description: ''
        required: true
        content:
          application/json:
            schema:
              required:
              - subscriber_id
              properties:
                subscriber_id:
                  type: integer
                  isRequired: true
                first_name:
                  description: First Name
                  type: string
                  isRequired: true
                last_name:
                  description: Last Name
                  type: string
                  isRequired: true
                phone:
                  description: Phone Number
                  type: string
                  isRequired: true
                email:
                  description: Email
                  type: string
                  isRequired: true
                gender:
                  description: Gender
                  type: string
                  isRequired: true
                has_opt_in_sms:
                  description: Has opt-in SMS is required if property Phone Number is not empty
                  type: boolean
                  isRequired: true
                has_opt_in_email:
                  description: Has opt-in Email is required if property Email is not empty
                  type: boolean
                  isRequired: true
                consent_phrase:
                  description: Consent phrase is required if property Has Opt In SMS equal true
                  type: string
                  isRequired: true
              type: object
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  status:
                    type: string
                    example: success
