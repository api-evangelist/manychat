      security:
      - Bearer: []
      x-summary-source: derived
  /fb/subscriber/findByCustomField:
    get:
      tags:
      - Subscriber
      summary: 9fc380dcb49bb134b9405d4269896f56
      description: '***Limit:*** 10 queries per second.


        This API method only works with Text and Number types of Custom User Fields.


        Results are sorted by last Custom User Field value update for a specific user.


        List is limited by 100 elements.'
      operationId: 9fc380dcb49bb134b9405d4269896f56
      parameters:
      - name: field_id
        in: query
        description: ''
        required: true
        schema:
          type: integer
      - name: field_value
        in: query
        description: ''
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  status:
                    type: string
                    example: success
                    isRequired: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Subscriber'
                    maxItems: 100
                    isRequired: true
                type: object
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Error'
      security:
      - Bearer: []
      x-summary-source: derived
  /fb/subscriber/findBySystemField:
    get:
      tags:
      - Subscriber
      summary: Ef59064a933ef7464083a39c520a274b
      description: '***Limit:*** 50 queries per second.

        Set one parameter: Email OR Phone.'
      operationId: ef59064a933ef7464083a39c520a274b
      parameters:
      - name: email
        in: query
        description: 'E-Mail (example: test@manychat.com)'
        schema:
          type: string
      - name: phone
        in: query
        description: 'Phone number (example: +15400000000)'
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                properties:
                  status:
                    type: string
                    example: success
                    isRequired: true
                  data:
                    $ref: '#/components/schemas/Subscriber'
