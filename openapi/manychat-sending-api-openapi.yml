openapi: 3.2.0
info:
  title: ManyChat Sending API
  description: Help article is available here
  version: beta
servers:
- url: ''
tags:
- name: Sending
paths:
  /fb/sending/sendContent:
    post:
      tags:
      - Sending
      summary: Send content to subscriber
      description: '***Limit:*** 25 queries per second'
      operationId: b6ae94031676b69a57eb2ad5ea1413f9
      requestBody:
        description: 'Data format: <https://manychat.github.io/dynamic_block_docs/><br>

          Supported message tags: <https://developers.facebook.com/docs/messenger-platform/send-messages/message-tags#supported_tags><br>

          More about message tags in ManyChat: <https://support.manychat.com/support/solutions/articles/36000195552-message-tags><br>

          <br>

          **Attention! After March 4, 2020 requests without message tag may cause error**'
        required: true
        content:
          application/json:
            schema:
              required:
              - subscriber_id
              - data
              properties:
                subscriber_id:
                  type: integer
                  isRequired: true
                data:
                  type: object
                  additionalProperties: false
                  isRequired: true
                message_tag:
                  type: string
                  example: ACCOUNT_UPDATE
                  isRequired: true
                otn_topic_name:
                  type: string
                  example: Сhannel news
                  isRequired: true
              type: object
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Success'
        '400':
          description: 'Possible error codes:<br>

            3011 - Content can’t be sent to subscriber without message tag. Subscriber’s last interaction was over 24h ago.<br>

            3021 - Content can’t be sent to subscriber. The subscriber has no One-Time Notification tokens for the selected topic.<br>

            3031 - Content can’t be sent to subscriber without Notification Reason. Subscriber’s last interaction was more than 24 hours ago.<br>

            304X - Content can’t be sent to subscriber via specific channel.<br>'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Error_With_Code'
      security:
      - Bearer: []
  /fb/sending/sendContentByUserRef:
    post:
      tags:
      - Sending
      summary: Send content to user ref
      description: '***Limit:*** 25 queries per second'
      operationId: 637120a69445b2892f725cbfeaf347ca
      requestBody:
        description: Attention! The method doesn't process actions<br>Data format <https://manychat.github.io/dynamic_block_docs/>
        required: true
        content:
          application/json:
            schema:
              required:
              - user_ref
              - data
              properties:
                user_ref:
                  type: integer
                  isRequired: true
                data:
                  type: object
                  additionalProperties: false
                  isRequired: true
              type: object
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Success'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Error'
      security:
      - Bearer: []
  /fb/sending/sendFlow:
    post:
      tags:
      - Sending
      summary: Send Automation to subscriber
      description: '***Limit:*** 20 queries per second, 100 queries per a given subscriber per hour'
      operationId: 28f1abbb07b0d4773b846dbeb3880e3c
      requestBody:
        description: 'Supported message tags: <https://developers.facebook.com/docs/messenger-platform/send-messages/message-tags#supported_tags>'
        required: true
        content:
          application/json:
            schema:
              required:
              - subscriber_id
              - flow_ns
              properties:
                subscriber_id:
                  type: integer
                  isRequired: true
                flow_ns:
                  type: string
                  isRequired: true
              type: object
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Success'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Error'
      security:
      - Bearer: []
components:
  schemas:
    Response_Error:
      description: ''
      required:
      - status
      - message
      - details
      properties:
        status:
          type: string
          example: error
          isRequired: true
        message:
          type: string
          isRequired: true
        details:
          required:
          - messages
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/Response_Error_Message'
              isRequired: true
          type: object
          additionalProperties: false
          isRequired: true
      type: object
      additionalProperties: false
    Response_Success:
      description: ''
      required:
      - status
      properties:
        status:
          type: string
          example: success
          isRequired: true
      type: object
      additionalProperties: false
    Response_Error_With_Code:
      description: ''
      required:
      - status
      - message
      - code
      properties:
        status:
          type: string
          example: error
          isRequired: true
        message:
          type: string
          isRequired: true
        code:
          type: integer
          isRequired: true
      type: object
      additionalProperties: false
    Response_Error_Message:
      description: ''
      required:
      - message
      properties:
        message:
          type: string
          isRequired: true
      type: object
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: http
      name: Authorization
      in: header
      scheme: bearer
