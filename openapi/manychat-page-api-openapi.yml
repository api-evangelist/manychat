  /fb/page/setBotFields:
    post:
      tags:
      - Page
      summary: 327327a53f87fecaeb9f7cd69c0433af
      description: '***Limit:*** 10 queries per second'
      operationId: 327327a53f87fecaeb9f7cd69c0433af
      requestBody:
        description: 'Set multiple bot fields.<br>

          The number of bot fields is limited to 20 for one request.<br>

          Use **field_id** OR **field_name** to specify the field.<br>

          ***For example:***<br>

          <br>

          ```"fields": [{"field_id": 77777777, "field_value": 555}, {"field_name": "count", "field_value": 12}]```'
        required: true
        content:
          application/json:
            schema:
              required:
              - fields
              properties:
                fields:
                  type: array
                  items:
                    required:
                    - field_id
                    - field_name
                    - field_value
                    properties:
                      field_id:
                        type: integer
                        isRequired: true
                      field_name:
                        type: string
                        isRequired: true
                      field_value:
                        description: string, integer or boolean (see method description)
                        example: '''string'', 123, true, ''2018-07-18'', ''2018-07-02T00:00:00+00:00'''
                        isRequired: true
                    type: object
                    additionalProperties: false
                  isRequired: true
              type: object
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Success'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Error'
      security:
      - Bearer: []
      x-summary-source: derived
components:
  schemas:
    Otn_Topic:
      description: ''
      required:
      - id
      - name
      - description
      properties:
        id:
          type: integer
          isRequired: true
        name:
          type: string
          isRequired: true
        description:
          type: string
          isRequired: true
      type: object
      additionalProperties: false
    Tag:
      description: ''
      required:
      - id
      - name
      properties:
        id:
          type: integer
          isRequired: true
        name:
          type: string
          isRequired: true
      type: object
      additionalProperties: false
    Flow:
      description: ''
      required:
      - ns
      - name
      - folder_id
      properties:
        ns:
          description: Automation namespace - unique Automation ID
          type: string
          isRequired: true
        name:
          type: string
          isRequired: true
        folder_id:
          type: integer
          isRequired: true
      type: object
      additionalProperties: false
    Custom_Field:
      description: ''
      required:
      - id
      - name
      - type
      - description
      properties:
        id:
          type: integer
          isRequired: true
        name:
          type: string
          isRequired: true
        type:
          type: string
          enum:
          - text
          - number
          - date
          - datetime
          - boolean
          isRequired: true
        description:
          type: string
          isRequired: true
      type: object
      additionalProperties: false
    Page:
      description: ''
      required:
      - id
      - name
      - category
      - avatar_link
      - username
      - about
      - description
      - is_pro
      - timezone
      properties:
        id:
          description: This is Facebook Page ID
          type: integer
          isRequired: true
        name:
          type: string
          isRequired: true
        category:
          type: string
          isRequired: true
        avatar_link:
          type: string
          isRequired: true
        username:
          type: string
          isRequired: true
        about:
          type: string
          isRequired: true
        description:
          type: string
          isRequired: true
        is_pro:
          type: boolean
          isRequired: true
        timezone:
          type: string
          isRequired: true
      type: object
      additionalProperties: false
    Bot_Field:
      description: ''
      required:
      - id
      - name
      - type
      - description
      - value
      properties:
        id:
          type: integer
          isRequired: true
        name:
          type: string
          isRequired: true
        type:
          type: string
          enum:
          - text
          - number
          - date
          - datetime
          - boolean
          isRequired: true
        description:
          type: string
          isRequired: true
        value:
          description: string, integer or boolean
          example: '''string'', 123, true, ''2018-07-18'', ''2018-07-02T07:45:00+03:00'''
          isRequired: true
      type: object
      additionalProperties: false
    Response_Error:
      description: ''
      required:
      - status
      - message
      - details
      properties:
        status:
          type: string
          example: error
          isRequired: true
        message:
          type: string
          isRequired: true
        details:
          required:
          - messages
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/Response_Error_Message'
              isRequired: true
          type: object
          additionalProperties: false
          isRequired: true
      type: object
      additionalProperties: false
    Folder:
      description: ''
      required:
      - id
      - name
      - parent_id
      properties:
        id:
          type: integer
          isRequired: true
        name:
          type: string
          isRequired: true
        parent_id:
          type: integer
          isRequired: true
      type: object
      additionalProperties: false
    Response_Success:
      description: ''
      required:
      - status
      properties:
        status:
          type: string
          example: success
          isRequired: true
      type: object
      additionalProperties: false
    Growth_Tools:
      description: ''
      required:
      - id
      - name
      - type
      properties:
        id:
          type: integer
          isRequired: true
        name:
          type: string
          isRequired: true
        type:
          type: string
          isRequired: true
      type: object
      additionalProperties: false
    Response_Error_Message:
      description: ''
      required:
      - message
      properties:
        message:
          type: string
          isRequired: true
      type: object
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: http
      name: Authorization
      in: header
      scheme: bearer
