  /fb/page/setBotField:
    post:
      tags:
      - Page
      summary: 4032722e43e4b967e07d1b1279942254
      description: '***Limit:*** 10 queries per second'
      operationId: 4032722e43e4b967e07d1b1279942254
      requestBody:
        description: 'Depending on the type of Bot Field you will need to use one of the following type of data for "field_value".<br>

          ***For example:***<br>

          Text: "text" (string)<br>

          Number: 123 or 1.23 (integer or float)<br>

          Boolean: true or false (boolean)<br>

          Date: "2018-07-18" (string)<br>

          Date and time: "2018-07-02T00:00:00+00:00" (string)<br>

          <br>

          Data and time format for this API method is YYYY-MM-DDTHH:MM:SSP.  Where P is user’s timezone. For example May 1st 2018 06:30:24 UTC+3:00 should be formatted as 2018-05-01T06:30:24+03:00'
        required: true
        content:
          application/json:
            schema:
              required:
              - field_id
              - field_value
              properties:
                field_id:
                  type: integer
                  isRequired: true
                field_value:
                  description: string, integer or boolean (see method description)
                  example: '''string'', 123, true, ''2018-07-18'', ''2018-07-02T00:00:00+00:00'''
                  isRequired: true
              type: object
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Success'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response_Error'
      security:
      - Bearer: []
      x-summary-source: derived
  /fb/page/setBotFieldByName:
    post:
      tags:
      - Page
      summary: 63284ce7970087a42458d5a2c2594c1b
      description: '***Limit:*** 10 queries per second'
      operationId: 63284ce7970087a42458d5a2c2594c1b
      requestBody:
        description: 'Depending on the type of Bot Field you will need to use one of the following type of data for "field_value".<br>

          ***For example:***<br>

          Text: "text" (string)<br>

          Number: 123 or 1.23 (integer or float)<br>

          Boolean: true or false (boolean)<br>

          Date: "2018-07-18" (string)<br>

