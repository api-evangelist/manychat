  signals:
  - signal: Page.is_pro
    type: boolean
    source: 'components.schemas.Page.is_pro in https://api.manychat.com/swagger/compileJson?type=Page_API'
    detail: >-
      The API models a single boolean Pro flag per connected page. Whatever the marketing tier ladder
      looks like, the contract itself only distinguishes Pro from not-Pro.
  - signal: API access is gated on a paid tier
    source: https://help.manychat.com/hc/en-us/articles/14281252007580-Dev-Tools-Basics
    detail: >-
      ManyChat's Dev Tools documentation states the public API, the External Request action and most
      integrations require Pro or above. The API is not available on the free tier.
  - signal: billing unit is Active Contacts
    detail: >-
      ManyChat prices on unique contacts messaged in a month rather than on API calls. There is no
      per-request metering, no usage endpoint, and no quota field anywhere in the API contract — an agent
      cannot read its own consumption from the API.
