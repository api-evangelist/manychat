aid: manychat
name: ManyChat
description: >-
  ManyChat is a messenger marketing platform that enables businesses to build
  automated conversations and chat marketing flows across Instagram Direct
  Messages, Facebook Messenger, WhatsApp, TikTok, and SMS. It provides a
  visual flow builder, audience segmentation, broadcasts, and integrations
  with ecommerce and CRM tools to drive engagement, lead capture, and sales.
  The ManyChat API allows programmatic access to subscribers, custom fields,
  flows, and messaging using API key (Bearer token) authentication.
