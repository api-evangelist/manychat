apis:
  - aid: manychat:rest-api
    name: ManyChat REST API
    description: >-
      REST API for managing subscribers, custom fields, tags, flows, and
      sending messages in ManyChat across Instagram, Messenger, WhatsApp, and
      SMS. Authentication uses an API Key generated from the page Settings to
      API screen, passed as a Bearer token in the Authorization header.
      Interactive documentation is available via Swagger.
    humanURL: https://api.manychat.com/swagger
