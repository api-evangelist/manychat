- aid: manychat:manychat-profile-api
  name: ManyChat Profile API
  description: >-
    White-label profile and template management. A single operation that generates a single-use install
    link for a ManyChat template, served from its own Swagger document at
    api.manychat.com/swagger/compileJson?type=Profile_API. ManyChat publishes no rate limit for it.
  humanURL: https://api.manychat.com/swagger
  baseURL: https://api.manychat.com
  tags:
  - Profile
