- aid: manychat:manychat-page-api
  name: ManyChat Page API
  description: >-
    Page-level configuration for a connected ManyChat page: connected page info, tags, typed custom user
    field definitions, global bot fields, automations (flows) and folders, growth tools and One-Time
    Notification topics. 16 operations. Reads are limited to 100 queries per second and writes to 10;
    getFlows is the exception at 10 q/s. removeTag and removeTagByName delete the tag from the page and
    every subscriber carrying it and cannot be undone.
  humanURL: https://api.manychat.com/swagger
  baseURL: https://api.manychat.com
  tags:
  - Page
  - Tags
  - Custom Fields
  - Bot Fields
  - Flows
