apis:
- aid: manychat:rest-api
  name: ManyChat REST API
  description: >-
    REST API for managing subscribers, custom fields, tags, bot fields, flows, and sending messages in
    ManyChat across Instagram, Messenger, WhatsApp and SMS. 35 operations across four tags. Authentication
    uses an API key generated per connected page in Settings > API, passed as a Bearer token of the form
    `Bearer <page-id>:<api-key>`. ManyChat serves the machine-readable contract as OpenAPI 3.0 from
    api.manychat.com/swagger/compileJson, which the Swagger console at api.manychat.com/swagger loads.
    Only HTTP 200 and 400 are declared anywhere in the contract; there is no idempotency key, no
    pagination, and no rate-limit response headers.
  humanURL: https://api.manychat.com/swagger
  baseURL: https://api.manychat.com
