aid: manychat
name: ManyChat
description: >-
  ManyChat is a chat-marketing platform that lets businesses build automated
  conversations and marketing flows across Instagram Direct Messages, Facebook
  Messenger, WhatsApp, Telegram, TikTok and SMS. It provides a visual flow
  builder, audience segmentation, broadcasts, growth tools and integrations with
  ecommerce and CRM systems to drive engagement, lead capture and sales. The
  public ManyChat REST API is a page-scoped surface of 35 operations covering
  subscribers, tags, typed custom fields, page-level bot fields, automations and
  sending, published as OpenAPI 3.0 and served through an interactive Swagger
  console at api.manychat.com/swagger. Authentication is a per-page API key sent
  as an Authorization Bearer token in the form page-id:api-key; there is no
  OAuth, no scopes and no account-wide credential. ManyChat's only asynchronous
  surface runs outbound: the External Request flow step calls a partner endpoint
  and expects a Dynamic Block v2 JSON response back, so the integrator is the
  webhook receiver rather than ManyChat pushing events.
