- aid: manychat:manychat-sending-api
  name: ManyChat Sending API
  description: >-
    Send Dynamic Block content and trigger automations for a subscriber across Messenger, Instagram and
    WhatsApp. 3 operations. This is the surface governed by Meta policy rather than by ManyChat: outside
    the 24-hour messaging window a message tag is required (error 3011), One-Time Notification sends need
    a token for the topic (3021), and channel restrictions surface as the 304X error family. sendFlow is
    additionally capped at 100 queries per given subscriber per hour. There is no idempotency key, so a
    retry delivers a duplicate message.
  humanURL: https://api.manychat.com/swagger
  baseURL: https://api.manychat.com
  tags:
  - Sending
  - Messaging
  - Broadcast
  properties:
  - type: OpenAPI
    url: openapi/manychat-sending-api-openapi.yml
  - type: Overlay
    url: overlays/manychat-sending-api-overlay.yaml
- aid: manychat:manychat-subscriber-api
  name: ManyChat Subscriber API
  description: >-
    Look up, search, create, update, tag and set custom field values on subscribers. 15 operations. A
    subscriber carries per-channel identity fields for Messenger, Instagram, WhatsApp, email and SMS on
    one record. Search operations are hard-capped at 100 results with no pagination or cursor, so a full
    result set is unreachable through the API when the cap is hit.
  humanURL: https://api.manychat.com/swagger
  baseURL: https://api.manychat.com
  tags:
  - Subscriber
  - Contacts
  - Segmentation
  properties:
  - type: OpenAPI
    url: openapi/manychat-subscriber-api-openapi.yml
  - type: Overlay
    url: overlays/manychat-subscriber-api-overlay.yaml
