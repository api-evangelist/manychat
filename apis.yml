x-pointer-notes:
  - >-
    NO `MCPServer` pointer is emitted. mcp/manychat-mcp.yml is a DERIVED candidate tool list with
    `deployment.mode: none` — ManyChat ships no first-party MCP server in either remote or stdio form
    (api.manychat.com/mcp 404s). It is wired as `MCPCandidate` so the artifact is discoverable without
    crediting ManyChat with an agent surface it does not serve.
  - >-
    NO `WellKnown` or `SecurityTxt` pointer is emitted. Every /.well-known/ path was probed on all three
    hosts and none returned a document on this run. The probe is wired as `WellKnownProbe` because it
    records an absence, not a presence.
  - >-
    NO `Idempotency` pointer is emitted. ManyChat publishes no idempotency key, header or de-duplication
    contract on any write operation.
  - >-
    NO `AsyncAPI` pointer is emitted — ManyChat publishes no AsyncAPI document. `Webhooks` IS emitted,
    because the External Request / Dynamic Block contract is a real, first-party, versioned outbound
    webhook surface, even though it runs in the unusual direction.
  - >-
    NO `AgentCard` pointer is emitted. /.well-known/agent-card.json and /.well-known/agent.json return 404
    on every reachable ManyChat host.
  - >-
    NO `Deprecation` pointer is emitted. ManyChat publishes no deprecation policy and no Sunset/Deprecation
    header support; its one superseded operation (getWidgets) is flagged only in prose.
  - >-
    NO `Compliance` or `TrustCenter` pointer is emitted. trust.manychat.com and manychat.com/security both
    return 403 behind a Cloudflare challenge, so no certification claim could be read from a ManyChat
    surface.
  - >-
    NO `Postman` pointer is emitted. A public ManyChat workspace exists at postman.com/postman-atlas but it
    is published by Postman's own Atlas team, not by ManyChat.
  - >-
    NO `TermsOfService`, `PrivacyPolicy`, `Blog` or `DeveloperPortal` pointers are emitted. Those pages are
    on manychat.com, which returns 403 to every non-browser client, so none could be verified; and
    developers.manychat.com 302-redirects to the marketing homepage rather than serving a portal.
