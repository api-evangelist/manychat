  note: >-
    No deprecation policy, no RFC 8594 Sunset/Deprecation header support, and no dated removal notices are
    published. Deprecation is communicated only as prose inside an operation description, and the one
    example (getWidgets -> "Use getGrowthTools instead.") is not marked `deprecated: true` in the spec, so
    no tooling can detect it.
