  docs: https://api.manychat.com/swagger
  note: >-
    `info.version` in the OpenAPI ManyChat publishes is the literal string "beta" and has been for the
    life of the document. There is no version segment in the path (`/fb/page/...`, not `/v1/fb/page/...`),
    no version header, and no dated pinning. Callers have no way to pin behaviour.
