x-note: 'Captures the API Evangelist refinements applied on top of the Swagger document ManyChat publishes: a real production
  server host (the provider ships an empty relative servers[] entry), readable operation IDs alongside the provider''s generated
  hash IDs, the authentication key format, and explicit x-idempotent:false on every write because ManyChat publishes no idempotency
  contract. The harvested original is never mutated.'
