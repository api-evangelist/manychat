agent_safety_notes:
  - >-
    remove_tag / remove_tag_by_name delete the tag from the page AND every subscriber carrying it.
    ManyChat's own description says "This action can not be undone." These should be gated behind human
    confirmation in any server built from this candidate list.
  - >-
    send_content and send_flow deliver real messages to real people on Meta-owned channels and are
    governed by Meta's 24-hour messaging window and message-tag policy. There is no idempotency key, so a
    retry sends a second message.
