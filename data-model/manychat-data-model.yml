note: >-
  Entity graph derived from `components.schemas` and the id-reference fields in the OpenAPI ManyChat
  publishes at https://api.manychat.com/swagger. ManyChat's model is rooted on the Page (a connected
  Facebook/Instagram/WhatsApp channel), which owns every other object; the Subscriber is the transactional
  centre. There is no cross-page addressing in the public API — every API key is scoped to one page, so
  `page_id` is effectively constant for a given credential.
root_entity: Page
