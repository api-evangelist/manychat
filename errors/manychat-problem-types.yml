note: >-
  ManyChat does not use RFC 9457 `application/problem+json`. It returns a proprietary JSON envelope on
  `application/json` with an HTTP 400 for every failure documented in the spec — there are no 401/403/404/
  409/429/5xx responses declared anywhere in the published Swagger document. Two envelope shapes exist and
  they are NOT interchangeable: validation failures return `Response Error` (a `details.messages[]` array of
  human strings, no machine code), while send/lookup failures return `Response Error With Code` (a numeric
  `code`). An agent cannot tell which envelope it will get from the operation alone in most cases.
