  registry probes against repo.packagist.org, registry.npmjs.org and pypi.org, plus the
  https://github.com/manychat GitHub organization listing, 2026-08-13
note: >-
  ManyChat ships exactly one first-party API client library — a PHP SDK — and Packagist reports it
  ABANDONED. Its last release, v1.0.5, is dated 2020-12-11, and the GitHub repository has not been pushed
  to since the same day. That is a five-and-a-half year gap against an API whose own contract still carries
  a "beta" version string. Every other ManyChat-branded package in a public registry is either a
  design-asset bundle (@manychat/icons) or third-party. There is no official JavaScript/TypeScript, Python,
  Ruby, Go, Java or .NET client.
